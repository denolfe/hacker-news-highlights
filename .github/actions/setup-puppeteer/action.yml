name: Setup Puppeteer
description: |
  Installs Chrome system libraries and restores the Puppeteer browser cache.
  Run before `pnpm install`, whose postinstall downloads the browser on a cache miss.

runs:
  using: composite
  steps:
    - name: Install Puppeteer dependencies
      shell: bash
      run: |
        packages=(
          ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0t64
          libatk1.0-0t64 libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1
          libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0t64 libgtk-3-0t64
          libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6
          libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1
          libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1
          libxss1 libxtst6 lsb-release wget xdg-utils
        )
        # The runner image ships Google Chrome, so these are usually present;
        # skipping apt-get update avoids a slow, variable mirror fetch
        missing=()
        for pkg in "${packages[@]}"; do
          dpkg-query -W -f='${Status}\n' "$pkg" 2>/dev/null | grep -qx 'install ok installed' || missing+=("$pkg")
        done
        if [ ${#missing[@]} -eq 0 ]; then
          echo "All Puppeteer dependencies already installed"
          exit 0
        fi
        echo "Installing missing packages: ${missing[*]}"
        sudo apt-get update
        sudo apt-get install -y "${missing[@]}"

    - name: Cache Puppeteer browser
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
