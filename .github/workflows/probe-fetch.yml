name: probe-fetch

on:
  push:
    branches:
      - fix/hn-browser-fallback

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0 libgtk-3-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Node setup
        uses: ./.github/actions/setup
        with:
          node-version: 23.6.0
          pnpm-version: 9.15.4
          pnpm-install-cache-key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Probe story fetch
        run: |
          mkdir -p cache
          cat > src/probe.tmp.ts <<'EOF'
          import { fetchStoryHtml } from '@/hn/index.js'
          import { needsBrowserFetch, parseSiteContent } from '@/hn/parseSiteContent.js'

          const urls = [
            'https://www.intel.com/content/www/us/en/products/details/discrete-gpus/data-center-gpu/d-series.html',
            'https://z.ai/blog/glm-legal',
          ]
          for (const url of urls) {
            const plain = await fetch(url).then(async r => `${r.status} ${(await r.text()).length}b`)
            const html = await fetchStoryHtml(url)
            const { textContent } = await parseSiteContent(html)
            console.log(
              `PROBE ${url}\n  plain: ${plain}\n  final: ${html.length}b, text ${textContent?.length ?? 0} chars, insufficient=${needsBrowserFetch(html)}\n  preview: ${JSON.stringify(textContent?.trim().slice(0, 200))}`,
            )
          }
          process.exit(0)
          EOF
          NODE_OPTIONS=--no-deprecation pnpm exec tsx src/probe.tmp.ts
