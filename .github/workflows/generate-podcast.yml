name: generate-podcast

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'
        type: boolean
      voice_service:
        description: 'Voice service to use'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - elevenlabs
      skip_publish:
        description: 'Skip publishing to podcast host'
        required: false
        default: 'true'
        type: boolean
      video:
        description: 'Generate YouTube video'
        required: false
        default: 'false'
        type: boolean

  schedule:
    # Fires early on purpose: GitHub cron is delayed 30min-3.5h (see issue #13).
    # Episode release time is controlled by Transistor scheduled publish (6:30am ET),
    # and 05:47 UTC lands the story snapshot in HN's settled overnight window.
    - cron: '47 5 * * *'

permissions:
  contents: read
  actions: write # for caching

env:
  COVERED_STORIES_CACHE_KEY: ${{ github.ref }}-covered-stories

jobs:
  podcast:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Puppeteer
        uses: ./.github/actions/setup-puppeteer

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Node setup
        uses: ./.github/actions/setup
        with:
          pnpm-install-cache-key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Create cache directory
        run: mkdir ./cache

      # Restore cache from cache/covered-stories
      - name: Restore covered-stories
        id: cache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./cache/covered-stories
          key: ${{ env.COVERED_STORIES_CACHE_KEY }}

      - name: Generate podcast
        run: |
          ARGS=""
          if [ "$SKIP_PUBLISH" = "true" ]; then
            ARGS="--no-publish"
          fi
          if [ "$VIDEO" = "true" ]; then
            ARGS="$ARGS --video"
          else
            ARGS="$ARGS --no-video"
          fi
          echo "ARGS: '$ARGS'"
          pnpm start $ARGS
        env:
          SKIP_PUBLISH: ${{ github.event.inputs.skip_publish }}
          VIDEO: ${{ github.event.inputs.video || 'false' }}
          SCHEDULED_RELEASE: ${{ github.event_name == 'schedule' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
          DEBUG: ${{ github.event.inputs.debug }}
          # Use `elevenlabs` on main, else `openai`
          VOICE_SERVICE: ${{ github.event.inputs.voice_service || (github.ref == 'refs/heads/main' && 'elevenlabs' || 'openai') }}
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: output-and-cache
          path: |
            output
            cache
            !output/*.mp4
          retention-days: 7

      # Separate from output-and-cache so text transcripts keep for analysis at max
      # retention (90d) without also keeping ~45MB of audio/screenshots per run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transcripts
          path: |
            output/transcript.txt
            output/show-notes.txt
          retention-days: 90
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: video
          path: output/*.mp4
          retention-days: 1
          if-no-files-found: ignore

      - name: Delete Previous Cache
        if: ${{ steps.cache-restore.outputs.cache-hit }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete "${{ env.COVERED_STORIES_CACHE_KEY }}" --confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cache cache/covered-stories for next run
      - name: Cache covered-stories
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./cache/covered-stories
          key: ${{ env.COVERED_STORIES_CACHE_KEY }}

      - name: Episode report
        if: always()
        run: |
          section() {
            # section <heading> <file> [collapsed] [fence]
            local heading="$1" file="$2" collapsed="$3" fence="$4"
            [ -f "$file" ] || return 0
            local open close
            if [ "$fence" = "fence" ]; then
              open='```'
              close='```'
            fi
            # awk 1 guarantees a trailing newline so the closing fence is never
            # glued to the last line (JSON/text files lack a trailing newline).
            if [ "$collapsed" = "collapsed" ]; then
              {
                echo "<details><summary>${heading}</summary>"
                echo
                [ -n "$open" ] && echo "$open"
                awk 1 "$file"
                [ -n "$close" ] && echo "$close"
                echo
                echo "</details>"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "## ${heading}"
                echo
                [ -n "$open" ] && echo "$open"
                awk 1 "$file"
                [ -n "$close" ] && echo "$close"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "# 🎙️ Episode Report" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          section "Show notes" output/show-notes.txt
          section "YouTube chapters" output/youtube-chapters.txt collapsed fence
          section "Transcript" output/transcript.txt collapsed
          section "Covered stories" cache/covered-stories collapsed fence
